name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and runtime dependencies
        run: python -m pip install -e .

      - name: Verify tracked-file release hygiene
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.venv|__pycache__|[^/]+\.egg-info)(/|$)'; then
            echo "Tracked local/build artifacts must not be committed." >&2
            exit 1
          fi

      - name: Verify source compiles
        run: python -m compileall -q incident_pack.py incidentpack lab scripts

      - name: Verify package entry points
        run: |
          incident-pack --version
          incident-pack --help

      - name: Run unit and CLI smoke tests
        run: python -m unittest discover -s tests -v

      - name: Run deterministic CLI smoke scenario
        run: |
          mkdir -p /tmp/incident-pack-ci
          incident-pack --target 10.20.30.40 --ports 443 22 \
            --mock --mock-scenario service-refused --non-interactive \
            --out-dir /tmp/incident-pack-ci
          test -n "$(find /tmp/incident-pack-ci -name '*.json' -print -quit)"
          test -n "$(find /tmp/incident-pack-ci -name '*.md' -print -quit)"

      - name: Run live loopback success/failure matrix
        run: python -m lab.live_demo --out-dir /tmp/incident-pack-live-demo

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install developer checks
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check incident_pack.py incidentpack lab scripts tests

      - name: Build and verify release archive
        shell: bash
        run: |
          ./scripts/build_release.sh HEAD dist
          test -n "$(find dist -maxdepth 1 -name 'network-incident-pack-v*.zip' -print -quit)"
