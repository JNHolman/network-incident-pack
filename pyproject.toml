[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-incident-pack"
version = "1.1.1"
description = "Host-side network incident evidence collection and operational workflow automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
]

[project.urls]
Repository = "https://github.com/JNHolman/servicenow-incident-pack"
Issues = "https://github.com/JNHolman/servicenow-incident-pack/issues"

[project.scripts]
incident-pack = "incidentpack.cli:main"

[tool.setuptools.packages.find]
include = ["incidentpack*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
